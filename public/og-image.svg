<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#f5f5f7"/>
  
  <!-- Subtle decorative grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Center Card -->
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Badge -->
  <rect x="140" y="140" width="220" height="40" rx="20" fill="#f5f5f7" stroke="#e0e0e0"/>
  <circle cx="160" cy="160" r="5" fill="#0066cc"/>
  <text x="175" y="165" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" letter-spacing="0.5">NUMFORGE.ONLINE</text>

  <!-- Title -->
  <text x="140" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="52" font-weight="700" fill="#1d1d1f" letter-spacing="-1">
    Number Systems &amp;
  </text>
  <text x="140" y="300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="52" font-weight="700" fill="#0066cc" letter-spacing="-1">
    Digital Electronics Tools
  </text>

  <!-- Subtitle -->
  <text x="140" y="360" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="22" font-weight="400" fill="#7a7a7a">
    Binary Conversions &bull; Two’s Complement &bull; Logic Gates &bull; IEEE-754 Floats &bull; Bitwise Tools
  </text>

  <!-- Feature Pills -->
  <g transform="translate(140, 420)">
    <rect x="0" y="0" width="190" height="48" rx="24" fill="#0066cc"/>
    <text x="95" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Base 2 to Base 36</text>

    <rect x="205" y="0" width="180" height="48" rx="24" fill="#f5f5f7" stroke="#e0e0e0"/>
    <text x="295" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="middle">0ms Local Engine</text>

    <rect x="400" y="0" width="190" height="48" rx="24" fill="#f5f5f7" stroke="#e0e0e0"/>
    <text x="495" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="middle">Step-by-Step Proofs</text>

    <rect x="605" y="0" width="160" height="48" rx="24" fill="#f5f5f7" stroke="#e0e0e0"/>
    <text x="685" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="middle">100% Private</text>
  </g>
</svg>
